<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Story ❤️</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================
     OPENING SCREEN
========================================= -->

<section class="opening">

    <div class="opening-content">

        <h1>
            OUR💞STORY
        </h1>

        <p>
            Journey of two heart & one soul
        </p>

        <button id="startButton">
            Ready for Surprise 🤩
        </button>

    </div>

</section>


<!-- =========================================
     FIRST STORY SCREEN
========================================= -->

<section id="firstStory">

    <div class="first-story-content">

        <div class="story-label">
            ✨ OUR STORY BEGINS ✨
        </div>

        <h2>
            8 October 2024
        </h2>

        <p class="story-line">
            This is how we both started 
            our Journey Together...
        </p>

        <div class="story-heart">
            ❤️
        </div>

        <button id="musicButton">
            🎵 Click for Music
        </button>

        <button id="continueButton">
            Continue →
        </button>

    </div>

</section>
<section id="chapter2november"
    style="
        display:none;
        position:relative;
        width:100%;
        height:100vh;
        overflow:hidden;
        background:#000;
    ">

    <img
        src="2-november.jpg"
        alt="2 November 2024"
        style="
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            object-fit:contain;
            background:#000;
        "
    >

    <div
        style="
            position:absolute;
            inset:0;
            background:linear-gradient(
                to bottom,
                transparent 35%,
                rgba(0,0,0,.15) 50%,
                rgba(0,0,0,.85) 75%,
                #000 100%
            );
            z-index:2;
        "
    ></div>

    <div
        style="
            position:absolute;
            bottom:0;
            left:0;
            width:100%;
            padding:40px 20px 30px;
            text-align:center;
            z-index:3;
            color:white;
        "
    >

        <div
            style="
                color:#ff7da0;
                font-size:18px;
                letter-spacing:3px;
                margin-bottom:15px;
            "
        >
            2 November 2024
        </div>

        <p
            style="
                margin:0 auto 25px;
                max-width:600px;
                color:white;
                font-size:20px;
                line-height:1.6;
                font-style:italic;
                text-shadow:0 2px 10px #000;
            "
        >
            Another little memory from the beginning
            of our story. ❤️
        </p>

        <button
            id="next2NovemberButton"
            style="
                padding:17px 42px;
                min-width:220px;
                border:0;
                border-radius:50px;
                background:#ff2f6d;
                color:white;
                font-size:19px;
                font-weight:bold;
                box-shadow:0 0 25px rgba(255,47,109,.6);
            "
        >
            Continue →
        </button>

    </div>

</section>
    
<!-- =========================================
     MUSIC
========================================= -->

<audio
    id="storyMusic"
    loop
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- =========================================
     FLOATING HEART BUBBLES
========================================= -->

<div id="heartBubbles"></div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="script.js"></script>


</body>

</html>
