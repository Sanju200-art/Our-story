<!DOCTYPE html>
<html>

<head>

    <title>Our Story ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section class="opening">

    <div class="opening-content">

        <h1> OUR💞STORY </h1>

        <p>Journey of two heart & one soul</p>

        <button id="startButton">
            Ready for Surprise 🤩
        </button>

    </div>

</section>

<!-- FIRST STORY SCREEN -->

<section id="firstStory">

    <div class="first-story-content">

        <div class="story-label">
            ✨ OUR STORY BEGINS ✨
        </div>

        <h2>
            8 October 2024
        </h2>

        <p class="story-line">
            Sometimes the most beautiful stories
            begin quietly...
        </p>

        <div class="story-heart">
            ❤️
        </div>

        <button id="continueButton">
            Continue → 
        </button>

    </div>

</section>

</section>

<audio id="storyMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="heartBubbles"></div>
    
<script src="script.js"></script>

</body>

</html>
