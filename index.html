<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Story ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND HEARTS -->

    <div class="hearts">
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
    </div>


    <!-- PUZZLE SCREEN -->

    <main class="puzzle-screen">

        <button class="back-button" onclick="goBack()">←</button>

        <button class="music-button" onclick="toggleMusic()">
            🎵
        </button>


        <h1>
            🧩 PIECE OUR STORY<br>
            TOGETHER <span>❤️</span>
        </h1>


        <div class="small-heart">♡</div>


        <p class="subtitle">
            Some beautiful things take time to come together...
        </p>


        <!-- PUZZLE BOARD -->

        <div id="puzzleBoard" class="puzzle-board">

            <!-- 9 slots created by JavaScript -->

        </div>


        <p class="drag-text">
            Drag each piece into the correct place ❤️
        </p>


        <!-- PUZZLE PIECES -->

        <div id="piecesContainer"
             class="pieces-container">

        </div>


        <!-- SUCCESS MESSAGE -->

        <div id="successMessage"
             class="success-message">

            <div class="success-heart">
                ❤️
            </div>

            <h2>
                You found all the pieces!
            </h2>

            <p>
                Just like our story...<br>
                everything came together beautifully. ❤️
            </p>

        </div>


        <button id="puzzleContinue"
                class="puzzle-continue"
                onclick="continueStory()">

            Continue Our Story ❤️

        </button>


    </main>


    <!-- MUSIC -->

    <audio id="backgroundMusic"
           loop>

        <source src="music.mp3"
                type="audio/mpeg">

    </audio>


    <script src="script.js"></script>

</body>
</html>
