<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Story ❤️</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================
     OPENING SCREEN
========================================= -->

<section class="opening">

    <div class="opening-content">

        <h1>
            OUR💞STORY
        </h1>

        <p>
            Journey of two heart & one soul
        </p>

        <button id="startButton">
            Ready for Surprise 🤩
        </button>

    </div>

</section>


<!-- =========================================
     FIRST STORY SCREEN
========================================= -->

<section id="chapter8october">

    <img
        src="first-date.jpg"
        class="first-date-photo"
        alt="Our first date"
    >

    <div class="photo-overlay"></div>

    <div class="photo-story">

        <div class="photo-date">
            8 October 2024
        </div>

        <p>
            <!-- YOUR LINES WILL GO HERE -->
            This was the beginning of something
            I never wanted to forget. ❤️
        </p>

        <button id="nextChapterButton">
            Continue →
        </button>

    </div>

</section>
    
<!-- =========================================
     MUSIC
========================================= -->

<audio
    id="storyMusic"
    loop
>

    <source
        src="music.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- =========================================
     FLOATING HEART BUBBLES
========================================= -->

<div id="heartBubbles"></div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="script.js"></script>


</body>

</html>
