<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Georgia, serif;
    overflow-x: hidden;
}


/* =========================
   OPENING
========================= */

.opening {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    position: relative;
    overflow: hidden;
}

.opening::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255, 30, 90, 0.15);
    filter: blur(90px);
    border-radius: 50%;
}

.top-heart {
    font-size: 65px;
    margin-bottom: 20px;
    animation: beat 1.5s infinite;
    z-index: 2;
}

@keyframes beat {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
}

.small-title {
    font-size: 13px;
    letter-spacing: 4px;
    color: #ff8ba8;
    z-index: 2;
}

h1 {
    font-size: clamp(50px, 14vw, 80px);
    margin: 18px 0 0;
    z-index: 2;
}

h1 span {
    color: #ff3d72;
}

.subtitle {
    margin-top: 25px;
    max-width: 500px;
    color: #ccc;
    font-size: 18px;
    font-style: italic;
    line-height: 1.5;
    z-index: 2;
}

.begin-btn {
    margin-top: 42px;
    padding: 17px 35px;
    border: 1px solid #ff3d72;
    border-radius: 50px;
    background: #d41452;
    color: white;
    font-size: 17px;
    box-shadow: 0 0 25px rgba(255,40,100,.4);
    cursor: pointer;
    z-index: 2;
}


/* =========================
   HEART ANIMATION
========================= */

.animation {
    min-height: 100vh;
    width: 100%;
    display: none;
    position: relative;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background:
        radial-gradient(
            circle,
            rgba(255,20,80,.16),
            #050505 60%
        );
}

.animation.show {
    display: flex;
}


/* =========================
   TWO HEARTS
========================= */

.heart {
    position: absolute;

    font-size: 70px;

    opacity: 0;

    z-index: 5;

    filter:
        drop-shadow(0 0 12px #ff245f)
        drop-shadow(0 0 30px rgba(255,30,90,.7));
}


/* LEFT HEART */

.heart-one {

    left: -100px;

    animation:
        heartLeft 3s
        cubic-bezier(.2,.8,.3,1)
        forwards;
}


/* RIGHT HEART */

.heart-two {

    right: -100px;

    animation:
        heartRight 3s
        cubic-bezier(.2,.8,.3,1)
        forwards;
}


/* LEFT MOVEMENT */

@keyframes heartLeft {

    0% {
        left: -100px;
        top: 43%;
        opacity: 0;
        transform: scale(.6) rotate(-15deg);
    }

    15% {
        opacity: 1;
    }

    45% {
        left: 25%;
        top: 48%;
        transform: scale(.8) rotate(8deg);
    }

    75% {
        left: 40%;
        top: 50%;
        transform: scale(.95) rotate(-3deg);
    }

    100% {
        left: 46%;
        top: 50%;
        transform: scale(1) rotate(0deg);
        opacity: 1;
    }
}


/* RIGHT MOVEMENT */

@keyframes heartRight {

    0% {
        right: -100px;
        top: 57%;
        opacity: 0;
        transform: scale(.6) rotate(15deg);
    }

    15% {
        opacity: 1;
    }

    45% {
        right: 25%;
        top: 52%;
        transform: scale(.8) rotate(-8deg);
    }

    75% {
        right: 40%;
        top: 50%;
        transform: scale(.95) rotate(3deg);
    }

    100% {
        right: 46%;
        top: 50%;
        transform: scale(1) rotate(0deg);
        opacity: 1;
    }
}


/* =========================
   MERGED HEART
========================= */

.big-heart {

    position: absolute;

    left: 50%;
    top: 50%;

    font-size: 0;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(0);

    z-index: 10;

    animation:
        mergeHeart 1.8s
        cubic-bezier(.17,.67,.3,1.4)
        forwards 3.1s;

    filter:
        drop-shadow(0 0 15px #ff1f5d)
        drop-shadow(0 0 40px #ff1f5d)
        drop-shadow(0 0 80px rgba(255,20,80,.7));
}


.big-heart::before {

    content: "❤️";

    font-size: 125px;
}


@keyframes mergeHeart {

    0% {
        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    30% {
        transform:
            translate(-50%, -50%)
            scale(.7);

        opacity: 1;
    }

    55% {
        transform:
            translate(-50%, -50%)
            scale(1.35);
    }

    75% {
        transform:
            translate(-50%, -50%)
            scale(.95);
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1.1);

        opacity: 1;
    }
}


/* =========================
   GLOW WHEN THEY MERGE
========================= */

.merge-glow {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: #ff285f;

    filter: blur(25px);

    opacity: 0;

    transform: translate(-50%, -50%);

    animation:
        glow 1.5s
        ease-out
        forwards 3.1s;
}

@keyframes glow {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.2);

        opacity: 0;
    }

    40% {
        transform:
            translate(-50%, -50%)
            scale(5);

        opacity: .8;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(8);

        opacity: 0;
    }
}


/* =========================
   LITTLE HEARTS
========================= */

.particles {

    position: absolute;

    left: 50%;
    top: 50%;

    font-size: 20px;

    color: #ff7293;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.2);

    animation:
        particles 2s
        ease-out
        forwards 3.4s;
}

@keyframes particles {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    30% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(3);
    }
}


/* =========================
   FIRST CHAPTER
========================= */

.chapter {

    min-height: 100vh;

    width: 100%;

    padding: 80px 25px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;
}

.chapter-label {

    font-size: 13px;

    letter-spacing: 4px;

    color: #ff6b95;

    margin-bottom: 25px;
}

.date {

    font-size:
        clamp(32px, 9vw, 52px);

    font-weight: bold;

    line-height: 1.15;

    margin-bottom: 35px;
}

.story-line {

    width: 100%;

    max-width: 500px;

    font-size:
        clamp(20px, 5.5vw, 27px);

    line-height: 1.6;

    color: #eee;
}

.continue-btn {

    margin-top: 45px;

    min-width: 180px;

    padding: 15px 30px;

    border: none;

    border-radius: 40px;

    background: #d41452;

    color: white;

    font-size: 16px;

    box-shadow:
        0 0 25px rgba(255,30,100,.35);
}


/* =========================
   PHONE
========================= */

@media (max-width:500px) {

    .heart {
        font-size: 55px;
    }

    .big-heart::before {
        font-size: 105px;
    }

}

</style>
</head>


<body>


<!-- =========================
     OPENING
========================= -->

<section
    class="opening"
    id="opening"
>

    <div class="top-heart">
        ❤️
    </div>

    <div class="small-title">
        A STORY WRITTEN BY TWO HEARTS
    </div>

    <h1>
        Our <span>Story</span>
    </h1>

    <div class="subtitle">
        Some stories are meant to be remembered forever...
    </div>

    <button
        class="begin-btn"
        onclick="beginStory()"
    >
        Begin Our Story ❤️
    </button>

</section>


<!-- =========================
     HEART ANIMATION
========================= -->

<section
    class="animation"
    id="animation"
>

    <!-- TWO SMALL HEARTS -->

    <div class="heart heart-one">
        ❤️
    </div>

    <div class="heart heart-two">
        ❤️
    </div>


    <!-- MERGE GLOW -->

    <div class="merge-glow"></div>


    <!-- ONE BIG HEART -->

    <div class="big-heart"></div>


    <!-- SPARKLES -->

    <div class="particles">
        ✦　♡　✦　♡　✦　♡　✦
    </div>

</section>


<!-- =========================
     FIRST CHAPTER
========================= -->

<section
    class="chapter"
    id="chapter1"
>

    <div class="chapter-label">
        OUR FIRST CHAPTER
    </div>

    <div class="date">
        8 October 2024
    </div>

    <div class="story-line">

        It all started on...

        <br><br>

        the day our story quietly began. ❤️

    </div>

    <button
        class="continue-btn"
        onclick="continueStory()"
    >

        Continue →

    </button>

</section>


<script>


function beginStory() {

    const opening =
        document.getElementById("opening");

    const animation =
        document.getElementById("animation");

    opening.style.display = "none";

    animation.classList.add("show");

    animation.scrollIntoView({
        behavior: "smooth"
    });


    /*
       0s   hearts appear
       1s   hearts move together
       3s   hearts meet
       3.1s big heart appears
       3.4s sparkles
       5.7s chapter appears
    */

    setTimeout(function() {

        document
            .getElementById("chapter1")
            .scrollIntoView({
                behavior: "smooth"
            });

    }, 5700);

}


function continueStory() {

    alert(
        "Our next chapter is coming soon... ❤️"
    );

}

</script>


</body>
</html>
