<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: white;
    font-family: Georgia, serif;
}

body {
    overflow-x: hidden;
}

.screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px 20px;
    position: relative;
    overflow: hidden;
}

.glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255, 45, 100, 0.15);
    filter: blur(80px);
    border-radius: 50%;
    animation: pulse 4s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(.8); opacity: .4; }
    to { transform: scale(1.2); opacity: .8; }
}

.heart {
    font-size: 70px;
    animation: heartbeat 1.5s infinite;
    margin-bottom: 25px;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
}

.small-title {
    font-size: 14px;
    letter-spacing: 5px;
    color: #aaa;
    margin-bottom: 20px;
}

h1 {
    font-size: 48px;
    margin: 0;
    line-height: 1.1;
}

h1 span {
    color: #ff4f81;
}

.subtitle {
    margin-top: 20px;
    font-size: 18px;
    color: #ccc;
    font-style: italic;
}

.start-btn {
    margin-top: 45px;
    padding: 16px 35px;
    border: 1px solid #ff4f81;
    border-radius: 50px;
    background: rgba(255, 79, 129, .08);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: .3s;
}

.start-btn:hover {
    background: #ff4f81;
    transform: scale(1.05);
}

.chapter {
    display: none;
    min-height: 100vh;
    width: 100%;
    padding: 80px 25px;
    text-align: center;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chapter-label {
    font-size: 13px;
    letter-spacing: 4px;
    color: #ff6b95;
    margin-bottom: 25px;
}

.date {
    font-size: clamp(32px, 9vw, 52px);
    font-weight: bold;
    margin-bottom: 35px;
    line-height: 1.15;
}

.story-line {
    width: 100%;
    max-width: 500px;
    font-size: clamp(20px, 5.5vw, 27px);
    line-height: 1.6;
    color: #eee;
}

.continue-btn {
    margin-top: 45px;
    min-width: 180px;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #ff4f81;
    color: white;
    font-size: 16px;
}

@media (max-width: 500px) {
    h1 {
        font-size: 40px;
    }

    .date {
        font-size: 34px;
    }

    .story-line {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<!-- OPENING SCREEN -->
<section class="screen" id="opening">

    <div class="glow"></div>

    <div class="heart">❤️</div>

    <div class="small-title">
        A STORY WRITTEN BY TWO HEARTS
    </div>

    <h1>
        Our <span>Story</span>
    </h1>

    <div class="subtitle">
        Some stories are meant to be remembered forever...
    </div>

    <button class="start-btn" onclick="startStory()">
        Begin Our Story ❤️
    </button>

</section>


<!-- FIRST CHAPTER -->
<section class="chapter" id="chapter1">

    <div class="chapter-label">
        OUR FIRST CHAPTER
    </div>

    <div class="date">
        8 October 2024
    </div>

    <div class="story-line">
        It all started on...
        <br><br>
        the day our story quietly began. ❤️
    </div>

    <button class="continue-btn" onclick="nextChapter()">
        Continue →
    </button>

</section>


<script>

function startStory() {

    document.getElementById("opening").style.display = "none";

    document.getElementById("chapter1").style.display = "flex";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function nextChapter() {

    alert("Our next chapter is coming soon... ❤️");

}

</script>

</body>
</html>
